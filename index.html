<!doctype html>
<html lang="en" data-theme="dark" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06182B" />
    <meta
      name="description"
      content="NEXORA — a waterglass AI agent operating system. Command, build, automate."
    />
    <title>NEXORA — AI Agent OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('nexora.theme') === 'light' ? 'light' : 'dark'
        var motion = localStorage.getItem('nexora.settings')
        if (motion && motion.indexOf('"reducedMotion":true') !== -1) {
          document.documentElement.dataset.motion = 'reduced'
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
